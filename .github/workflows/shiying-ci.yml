name: shiying-ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SY_WORK: ${{ github.workspace }}/_work
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc binutils dpkg-dev file python3-pip python3-numpy python3-pil \
            libx11-dev libxrandr-dev libfreetype-dev libfontconfig-dev libpulse-dev \
            xvfb pulseaudio pulseaudio-utils x11-xserver-utils fonts-noto-cjk \
            binutils-mingw-w64-x86-64
          python3 -m pip install --user --break-system-packages ziglang==0.17.0
      - name: 取录制引擎（校验 sha256）
        run: bash build/fetch_deps.sh
      - name: 编译 x86_64／aarch64
        run: bash build/build.sh all
      - name: 编译 Windows
        run: bash build/build_win.sh
      - name: 出包
        run: bash build/release.sh
      - name: 复制 Windows 包为 ASCII 文件名
        run: cp _work/dist/*Windows*.zip _work/windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: _work/windows-portable.zip
          if-no-files-found: error
      - name: 回归测试
        run: timeout 600 bash tests/run_tests.sh

  windows-check:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: dist
      - name: 只跑 --check，不录屏
        shell: pwsh
        run: |
          if (-not (Test-Path dist\windows-portable.zip)) { Write-Error "缺少 Windows 免安装包"; exit 1 }
          New-Item -ItemType Directory -Force app | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path dist\windows-portable.zip).Path, (Join-Path (Get-Location) 'app'))
          Get-ChildItem -Recurse app | ForEach-Object { $_.FullName }
          $exe = Get-ChildItem -Recurse app -Filter *.exe | Where-Object { $_.Name -ne 'ffmpeg.exe' } | Select-Object -First 1
          if (-not $exe) { Write-Error "缺少录屏程序"; exit 1 }
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--check' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          $code = @(
            'using System;'
            'using System.Runtime.InteropServices;'
            'public static class IconCheck {'
            '  [DllImport("shell32.dll", CharSet = CharSet.Unicode, EntryPoint = "ExtractIconExW")]'
            '  public static extern uint ExtractIconEx(string file, int index, IntPtr[] large, IntPtr[] small, uint n);'
            '  [DllImport("user32.dll")]'
            '  public static extern bool DestroyIcon(IntPtr h);'
            '}'
          ) -join "`n"
          Add-Type -TypeDefinition $code
          $large = New-Object IntPtr[] 1
          $small = New-Object IntPtr[] 1
          $n = [IconCheck]::ExtractIconEx($exe.FullName, 0, $large, $small, 1)
          Write-Output "ExtractIconEx=$n large=$($large[0]) small=$($small[0])"
          if ($large[0] -ne [IntPtr]::Zero) { [void][IconCheck]::DestroyIcon($large[0]) }
          if ($small[0] -ne [IntPtr]::Zero) { [void][IconCheck]::DestroyIcon($small[0]) }
          if ($n -lt 1 -or $large[0] -eq [IntPtr]::Zero) { Write-Error "exe 没有图标"; exit 1 }

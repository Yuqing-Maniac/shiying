name: shiying-ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SY_WORK: ${{ github.workspace }}/_work
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc binutils dpkg-dev file python3-pip python3-numpy python3-pil \
            libx11-dev libxrandr-dev libfreetype-dev libfontconfig-dev libpulse-dev \
            xvfb pulseaudio pulseaudio-utils x11-xserver-utils fonts-noto-cjk \
            binutils-mingw-w64-x86-64
          python3 -m pip install --user --break-system-packages ziglang==0.17.0
      - name: 取录制引擎（校验 sha256）
        run: bash build/fetch_deps.sh
      - name: 编译 x86_64／aarch64
        run: bash build/build.sh all
      - name: 编译 Windows
        run: bash build/build_win.sh
      - name: 出包
        run: bash build/release.sh
      - name: 回归测试
        run: timeout 600 bash tests/run_tests.sh
